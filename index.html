<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>会议日程</title>
    <!-- 优化2：更换为国内访问更快的 Staticfile CDN -->
    <script src="https://cdn.staticfile.net/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #525659;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        #loading {
            color: white;
            margin-top: 50px;
            font-size: 16px;
        }
        #pdf-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }
        canvas {
            margin-bottom: 15px;
            max-width: 95%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            background-color: white;
        }
        .fallback-link {
            margin: 20px 0 40px 0;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="loading">正在加载日程，请稍候...</div>
    <div id="pdf-container"></div>
    <a href="./mingantu-schedule.pdf" class="fallback-link" target="_blank">获取 PDF 原文件</a>

    <script>
        const url = './mingantu-schedule.pdf';

        // 优化2：Worker 也使用国内 CDN
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.staticfile.net/pdf.js/2.16.105/pdf.worker.min.js';

        const container = document.getElementById('pdf-container');
        const loading = document.getElementById('loading');

        // 优化3：使用 async/await 实现按顺序排队渲染
        async function renderPDF() {
            try {
                const pdf = await pdfjsLib.getDocument(url).promise;
                const numPages = pdf.numPages;

                // 先把所有画布的坑位占好，防止页面跳动
                for (let i = 1; i <= numPages; i++) {
                    let canvas = document.createElement('canvas');
                    canvas.id = 'page-' + i;
                    container.appendChild(canvas);
                }

                // 一页一页地渲染（排队进行，不卡死手机）
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 1.5;
                    const viewport = page.getViewport({scale: scale});
                    
                    const canvas = document.getElementById('page-' + pageNum);
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.style.width = '100%';
                    canvas.style.maxWidth = '800px';
                    canvas.style.height = 'auto';

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    // 等待当前页渲染完毕
                    await page.render(renderContext).promise;

                    // 【核心优化】：只要第 1 页渲染完了，立刻隐藏加载提示！
                    // 用户马上就能看到内容，剩下的 10 页在后台默默加载
                    if (pageNum === 1) {
                        loading.style.display = 'none';
                    }
                }
            } catch (error) {
                loading.innerText = '在线预览加载失败，请点击下方按钮查看。';
                console.error('Error loading PDF:', error);
            }
        }

        renderPDF();
    </script>
</body>
</html>
