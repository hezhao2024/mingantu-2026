<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>会议日程</title>
    <!-- 使用国内 CDN 加速 -->
    <script src="https://cdn.staticfile.net/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #525659;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        #loading {
            color: white;
            margin-top: 50px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #pdf-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }
        canvas {
            margin-bottom: 15px;
            max-width: 95%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            background-color: white;
        }
        .fallback-link {
            margin: 20px 0 40px 0;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 加载提示文字 -->
    <div id="loading">准备加载日程...</div>
    <div id="pdf-container"></div>
    <a href="./mingantu-schedule.pdf" class="fallback-link" target="_blank">获取 PDF 原文件</a>

    <script>
        const url = './mingantu-schedule.pdf';

        // Worker 也使用国内 CDN
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.staticfile.net/pdf.js/2.16.105/pdf.worker.min.js';

        const container = document.getElementById('pdf-container');
        const loading = document.getElementById('loading');

        async function renderPDF() {
            try {
                // 【新增】：创建加载任务而不是直接获取
                const loadingTask = pdfjsLib.getDocument(url);
                
                // 【新增】：监听下载进度
                loadingTask.onProgress = function(progress) {
                    // 确保服务器返回了文件总大小 (total > 0)
                    if (progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        loading.innerText = `正在下载日程... ${percent}%`;
                    } else {
                        // 如果服务器（如 GitHub Pages）偶尔没返回总大小，则显示已下载的 KB 数
                        const kb = Math.round(progress.loaded / 1024);
                        loading.innerText = `正在下载日程... ${kb} KB`;
                    }
                };

                // 等待下载完成
                const pdf = await loadingTask.promise;
                
                // 下载完成后，提示正在渲染
                loading.innerText = '下载完成，正在渲染页面...';

                const numPages = pdf.numPages;

                // 先把所有画布的坑位占好，防止页面跳动
                for (let i = 1; i <= numPages; i++) {
                    let canvas = document.createElement('canvas');
                    canvas.id = 'page-' + i;
                    container.appendChild(canvas);
                }

                // 一页一页地渲染（排队进行，不卡死手机）
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 1.5;
                    const viewport = page.getViewport({scale: scale});
                    
                    const canvas = document.getElementById('page-' + pageNum);
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.style.width = '100%';
                    canvas.style.maxWidth = '800px';
                    canvas.style.height = 'auto';

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    // 等待当前页渲染完毕
                    await page.render(renderContext).promise;

                    // 只要第 1 页渲染完了，立刻隐藏加载提示！
                    if (pageNum === 1) {
                        loading.style.display = 'none';
                    }
                }
            } catch (error) {
                loading.innerText = '在线预览加载失败，请点击下方按钮查看。';
                console.error('Error loading PDF:', error);
            }
        }

        renderPDF();
    </script>
</body>
</html>
