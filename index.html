<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 允许双指缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议日程</title>
    <!-- 使用国内 CDN 加速 -->
    <script src="https://cdn.staticfile.net/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #525659;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        #loading-container {
            margin-top: 50px;
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #loading-text {
            margin-bottom: 5px;
        }
        #loading-subtext {
            font-size: 13px;
            color: #ccc;
            font-weight: normal;
        }
        #pdf-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }
        canvas {
            margin-bottom: 15px;
            max-width: 95%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            background-color: white;
        }
        .fallback-link {
            margin: 20px 0 40px 0;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 优化的加载提示面板 -->
    <div id="loading-container">
        <div id="loading-text">准备加载日程...</div>
        <div id="loading-subtext">正在连接服务器</div>
    </div>
    
    <div id="pdf-container"></div>
    <a href="./mingantu-schedule.pdf" class="fallback-link" target="_blank">获取 PDF 原文件</a>

    <script>
        const url = './mingantu-schedule.pdf';

        // Worker 也使用国内 CDN
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.staticfile.net/pdf.js/2.16.105/pdf.worker.min.js';

        const container = document.getElementById('pdf-container');
        const loadingContainer = document.getElementById('loading-container');
        const loadingText = document.getElementById('loading-text');
        const loadingSubtext = document.getElementById('loading-subtext');

        async function renderPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                
                // 1. 监听下载进度
                loadingTask.onProgress = function(progress) {
                    if (progress.total && progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        loadingText.innerText = `正在下载日程... ${percent}%`;
                        loadingSubtext.innerText = `已下载 ${(progress.loaded / 1024 / 1024).toFixed(2)} MB / ${(progress.total / 1024 / 1024).toFixed(2)} MB`;
                    } else {
                        // 如果服务器没返回总大小，显示已下载的 KB 数
                        const kb = Math.round(progress.loaded / 1024);
                        loadingText.innerText = `正在下载日程...`;
                        loadingSubtext.innerText = `已下载 ${kb} KB (努力加载中...)`;
                    }
                };

                // 等待下载完成
                const pdf = await loadingTask.promise;
                
                loadingText.innerText = '下载完成！';
                loadingSubtext.innerText = '正在解析 PDF 文件结构...';

                const numPages = pdf.numPages;

                // 先把所有画布的坑位占好，防止页面跳动
                for (let i = 1; i <= numPages; i++) {
                    let canvas = document.createElement('canvas');
                    canvas.id = 'page-' + i;
                    container.appendChild(canvas);
                }

                // 2. 一页一页地渲染，并显示渲染进度
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    // 更新渲染提示
                    if (pageNum === 1) {
                        loadingText.innerText = '正在生成画面...';
                        loadingSubtext.innerText = `正在渲染第 1 页，请稍候...`;
                    }

                    const page = await pdf.getPage(pageNum);
                    
                    // 保持高清晰度
                    const scale = 2.5; 
                    const viewport = page.getViewport({scale: scale});
                    
                    const canvas = document.getElementById('page-' + pageNum);
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.style.width = '100%';
                    canvas.style.maxWidth = '800px';
                    canvas.style.height = 'auto';

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    // 等待当前页渲染完毕
                    await page.render(renderContext).promise;

                    // 只要第 1 页渲染完了，立刻隐藏加载提示框！
                    if (pageNum === 1) {
                        loadingContainer.style.display = 'none';
                    }
                }
            } catch (error) {
                loadingText.innerText = '加载失败';
                loadingSubtext.innerText = '请点击下方按钮直接查看原文件';
                console.error('Error loading PDF:', error);
            }
        }

        renderPDF();
    </script>
</body>
</html>
